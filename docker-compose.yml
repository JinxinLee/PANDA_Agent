services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: panda_qa
      POSTGRES_USER: panda
      POSTGRES_PASSWORD: ${PANDA_POSTGRES_PASSWORD:-panda}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - panda_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U panda -d panda_qa"]
      interval: 5s
      timeout: 3s
      retries: 20

  qdrant:
    image: qdrant/qdrant:v1.15.5
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - panda_qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "bash", "-c", "</dev/tcp/localhost/6333"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  panda_postgres_data:
  panda_qdrant_data:
