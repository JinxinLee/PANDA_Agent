    required_answer_points:
      - point_id: p1
        text: >-
          PndRingSorter keeps a fixed-size ring buffer whose cells each
          cover a configurable time width (cellWidth); AddElement inserts a
          timestamped element into the cell for its time, so interleaved
          data is bucketed by time rather than arrival order.
        weight: 1.0
        critical: true
      - point_id: p2
        text: >-
          WriteOutElements releases entries from the lower-bound pointer up
          to a given index (WriteOutAll flushes everything), handing the
          bucketed FairTimeStamp data to GetOutputData in time order; the
          covered time span is cellWidth times the buffer size.
        weight: 1.0
        critical: true
      - point_id: p3
        text: >-
          PndRingSorter is an abstract base class (subclasses implement
          CreateElement for their data type), and PndBufferTestTask in the
          same package demonstrates driving the buffer in a task.
        weight: 1.0
        critical: true
