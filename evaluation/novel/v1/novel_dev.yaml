  - id: n012
    split: novel_dev
    language: en
    intent: data_flow
    query: >-
      The luminosity determination assumes the LMD geometry is perfectly
      aligned. Where do alignment corrections come from before a luminosity
      determination, and where do they enter the workflow?
    expected_status: answered
    allowed_source_versions:
      - luminosityfit@ddd83dcd1a74093bf48ef259a2849a67f9413f32
      - pandaroot@18c09e91100db27867ded30e708b4dae95bd8357
      - restgas_determination@11f1edc49dcbaeb61d707491a6d3bbec390fcd42
      - li_2026@9930dfd79c74b9d1dadc6d1eb6c093ac10ccb45e12f641887bcdc8b823b8690a
      - karavdina_2015@422421852c5a046c24e894a77b9380988ec8172914e9b30b055a100145c07a2b
      - pflueger_2017@1b6ec987fc1430be085f2a7ba631d634f6580115ff0a90dff090dfcba5e990f3
      - pandaroot_sphinx_2023_08_25_dev@5bff86c0f3a1102c80f3466a8ca0a63db48c0c7d8f142a78a0849219d7844f87
      - curated_panda_domain@1.0
    required_evidence_groups:
      - group_id: n012.e1
        role: lmd_alignment_method
        critical: true
        any_of:
          - source_id: karavdina_2015
            pdf_page: 114
            pdf_page_end: 129
      - group_id: n012.e2
        role: alignment_pipeline_position
        critical: true
        any_of:
          - source_id: luminosityfit
            path: python/Readme.md
    required_source_types:
      - paper
      - code
    required_answer_points:
      - point_id: p1
        text: >-
          LMD module alignment is treated as its own step: misaligned modules
          degrade track reconstruction, and the internal alignment is
          constrained with Millepede, which needs on the order of ten thousand
          tracks because a plain global matrix inversion at that size is
          infeasible.
        weight: 1.0
        critical: true
      - point_id: p2
        text: >-
          In the LuminosityFit workflow an alignment process may run before
          everything else, ahead of the IP-distribution creation and the
          luminosity-determination steps documented in the python Readme.
        weight: 1.0
        critical: true
