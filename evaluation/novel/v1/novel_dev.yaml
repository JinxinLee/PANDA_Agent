    language: en
    intent: api
    query: >-
      The MVD hits I read back from a file contain compact volume identifiers
      instead of readable volume paths. How can I translate such an identifier
      into the full detector path at analysis time, and what does that
      translation need?
    expected_status: answered
    allowed_source_versions:
      - luminosityfit@ddd83dcd1a74093bf48ef259a2849a67f9413f32
      - pandaroot@18c09e91100db27867ded30e708b4dae95bd8357
      - restgas_determination@11f1edc49dcbaeb61d707491a6d3bbec390fcd42
      - li_2026@9930dfd79c74b9d1dadc6d1eb6c093ac10ccb45e12f641887bcdc8b823b8690a
      - karavdina_2015@422421852c5a046c24e894a77b9380988ec8172914e9b30b055a100145c07a2b
      - pflueger_2017@1b6ec987fc1430be085f2a7ba631d634f6580115ff0a90dff090dfcba5e990f3
      - pandaroot_sphinx_2023_08_25_dev@5bff86c0f3a1102c80f3466a8ca0a63db48c0c7d8f142a78a0849219d7844f87
      - curated_panda_domain@1.0
    required_evidence_groups:
      - group_id: n007.e1
        role: mvd_volume_id_translation
        critical: true
        any_of:
          - source_id: pandaroot
            object_type: source_file
            path: tools/PndGeoHandling.h
          - source_id: pandaroot_sphinx_2023_08_25_dev
            object_type: sphinx_page
            path: pandaroot_sphinx_2023_08_25_dev/raw/~pandacc/documentation/2023-08-25-dev/sphinx/Tools/PndGeoHandling.html
    required_source_types: []
    required_answer_points:
      - point_id: p1
        text: >-
          PndGeoHandling converts between the encrypted per-hit volume paths
          (for example /1_1/34_2/101_1/) or shortIds and the full geometry
          paths of the TGeoManager, via GetPath and GetShortID.
        weight: 1.0
        critical: true
      - point_id: p2
        text: >-
          The translation needs an initialized TGeoManager with the correct
          geometry (for example from a FAIRGeom file), and for shortIds the
          sensor-name parameter container, so the instance must be created in
          a task's SetParContainers to have the names from the database.
        weight: 1.0
        critical: true
    required_identifiers:
      - text: PndGeoHandling
        kind: code_symbol
        critical: true
