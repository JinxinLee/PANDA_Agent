  - id: n019
    split: novel_dev
    language: en
    intent: algorithm_implementation
    query: >-
      How does PndRecoKalmanTask turn input PndTrack objects into fitted output
      tracks, including fitter selection, particle-hypothesis choice, and the
      construction of each persisted result?
    expected_status: answered
    allowed_source_versions:
      - luminosityfit@ddd83dcd1a74093bf48ef259a2849a67f9413f32
      - pandaroot@18c09e91100db27867ded30e708b4dae95bd8357
      - restgas_determination@11f1edc49dcbaeb61d707491a6d3bbec390fcd42
      - li_2026@9930dfd79c74b9d1dadc6d1eb6c093ac10ccb45e12f641887bcdc8b823b8690a
      - karavdina_2015@422421852c5a046c24e894a77b9380988ec8172914e9b30b055a100145c07a2b
      - pflueger_2017@1b6ec987fc1430be085f2a7ba631d634f6580115ff0a90dff090dfcba5e990f3
      - pandaroot_sphinx_2023_08_25_dev@5bff86c0f3a1102c80f3466a8ca0a63db48c0c7d8f142a78a0849219d7844f87
      - curated_panda_domain@1.0
    required_evidence_groups:
      - group_id: n019.e1
        role: kalman_task_configuration_contract
        critical: true
        any_of:
          - source_id: pandaroot
            object_type: source_file
            path: tracking/GenfitTools/recotasks/PndRecoKalmanTask.h
      - group_id: n019.e2
        role: kalman_task_execution_pipeline
        critical: true
        any_of:
          - source_id: pandaroot
            object_type: source_file
            path: tracking/GenfitTools/recotasks/PndRecoKalmanTask.cxx
    required_source_types:
      - code
    required_answer_points:
      - point_id: p1
        text: >-
          During Init, the task configures either PndRecoKalmanFit or
          PndRecoDafFit according to SetDaf, applies the selected Geane or
          Runge-Kutta track representation and propagation settings, resolves
          the input branch, and registers the configured PndTrack output branch.
        weight: 1.0
        critical: true
      - point_id: p2
        text: >-
          Exec clears the output and skips events above the busy-track cut. For
          each input track it uses either the configured particle hypothesis
          multiplied by track charge or, in ideal-hypothesis mode, the leading
          correlated MCTrack PDG code with the implementation's pion fallbacks.
        weight: 1.0
        critical: true
      - point_id: p3
        text: >-
          For a nonzero selected PDG hypothesis, the configured Kalman or DAF
          fitter produces the fitted track. The task then constructs the output
          PndTrack from the first and last parameters, track candidate, quality
          flag, chi2, NDF, and PID hypothesis, and passes the input index and
          input-branch ID to that constructor.
        weight: 1.0
        critical: true
    required_identifiers:
      - text: PndRecoKalmanTask
        kind: code_symbol
        critical: true
    forbidden_evidence: []
    concept_scopes: {}
    cluster_id: nf019
    challenge_tags: []
    review_status: approved
