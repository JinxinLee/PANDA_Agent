      - pandaroot@18c09e91100db27867ded30e708b4dae95bd8357
      - restgas_determination@11f1edc49dcbaeb61d707491a6d3bbec390fcd42
      - li_2026@9930dfd79c74b9d1dadc6d1eb6c093ac10ccb45e12f641887bcdc8b823b8690a
      - karavdina_2015@422421852c5a046c24e894a77b9380988ec8172914e9b30b055a100145c07a2b
      - pflueger_2017@1b6ec987fc1430be085f2a7ba631d634f6580115ff0a90dff090dfcba5e990f3
      - pandaroot_sphinx_2023_08_25_dev@5bff86c0f3a1102c80f3466a8ca0a63db48c0c7d8f142a78a0849219d7844f87
      - curated_panda_domain@1.0
    required_evidence_groups:
      - group_id: n001.e1
        role: encoded_version_branches_and_shell_behavior
        critical: true
        any_of:
          - source_id: restgas_determination
            path: configSettings.sh
      - group_id: n001.e2
        role: external_package_environment_variables
        critical: true
        any_of:
          - source_id: restgas_determination
            path: configSettings.sh
          - source_id: restgas_determination
            path: INSTALL.GSI
    required_source_types:
      - workflow
    required_answer_points:
      - point_id: p1
        text: >-
          The script encodes branches for FairSoft may16p1 with FairRoot
          v-17.10b and for FairSoft oct17 with FairRoot dev, assigning
          placeholder build/install paths for each pair. These are intended
          branch literals, not actual validation: without spaces around ==,
          each bracket expression is a single nonempty argument and evaluates
          true in Bash, so the first branch is taken regardless of the supplied
          version values.
        weight: 1.0
        critical: true
      - point_id: p2
        text: >-
          The branches export SIMPATH for the FairSoft build and FAIRROOTPATH
          for the FairRoot installation. Although the malformed tests make the
          first branch win in ordinary Bash, the source's nominal else branch
          only echoes the supplied values; it does not exit, throw, or enforce
          a nonzero failure status.
        weight: 1.0
        critical: true
