  - id: n008
    split: novel_dev
    language: en
    intent: algorithm_theory
    query: >-
      Before tracks can be fitted in the luminosity detector, the hits have to
      be grouped into track candidates. Which track-search approaches were
      developed for the LMD, and how do they compare?
    expected_status: answered
    allowed_source_versions:
      - luminosityfit@ddd83dcd1a74093bf48ef259a2849a67f9413f32
      - pandaroot@18c09e91100db27867ded30e708b4dae95bd8357
      - restgas_determination@11f1edc49dcbaeb61d707491a6d3bbec390fcd42
      - li_2026@9930dfd79c74b9d1dadc6d1eb6c093ac10ccb45e12f641887bcdc8b823b8690a
      - karavdina_2015@422421852c5a046c24e894a77b9380988ec8172914e9b30b055a100145c07a2b
      - pflueger_2017@1b6ec987fc1430be085f2a7ba631d634f6580115ff0a90dff090dfcba5e990f3
      - pandaroot_sphinx_2023_08_25_dev@5bff86c0f3a1102c80f3466a8ca0a63db48c0c7d8f142a78a0849219d7844f87
      - curated_panda_domain@1.0
    required_evidence_groups:
      - group_id: n008.e1
        role: lmd_track_search_comparison
        critical: true
        any_of:
          - source_id: karavdina_2015
            pdf_page: 72
            pdf_page_end: 78
    required_source_types:
      - paper
    required_answer_points:
      - point_id: p1
        text: >-
          Two track-search algorithms were developed for the LMD: a track
          following approach and a cellular automaton, and the thesis compares
          their performance for LMD reconstruction.
        weight: 1.0
        critical: true
      - point_id: p2
        text: >-
          The LMD records only a small number of hits per track, so all of
          them have to be used, unlike general tracking detectors with up to a
          hundred hits per track.
        weight: 1.0
        critical: true
      - point_id: p3
        text: >-
          The quality goal of the comparison is minimizing both missed and
          fake tracks, because either distorts the reconstructed theta-angle
          distribution on which the luminosity determination depends.
        weight: 1.0
        critical: true
      - point_id: p4
        text: >-
          In the studied low-momentum, high-multiplicity cases at 1.5 GeV/c,
          the Cellular Automaton has significantly smaller track losses and
          handles high-multiplicity events better than Track Following. At 15
          GeV/c, the difference is no longer significant and their performance
          is similar.
        weight: 1.0
        critical: true
