    intent: algorithm_theory
    query: >-
      The luminosity fit leans on an elastic-scattering model. Besides DPM,
      which alternative model was studied for PANDA luminosity, does it also
      exist as code, and what dominates the model uncertainty?
    expected_status: answered
    allowed_source_versions:
      - luminosityfit@ddd83dcd1a74093bf48ef259a2849a67f9413f32
      - pandaroot@18c09e91100db27867ded30e708b4dae95bd8357
      - restgas_determination@11f1edc49dcbaeb61d707491a6d3bbec390fcd42
      - li_2026@9930dfd79c74b9d1dadc6d1eb6c093ac10ccb45e12f641887bcdc8b823b8690a
      - karavdina_2015@422421852c5a046c24e894a77b9380988ec8172914e9b30b055a100145c07a2b
      - pflueger_2017@1b6ec987fc1430be085f2a7ba631d634f6580115ff0a90dff090dfcba5e990f3
      - pandaroot_sphinx_2023_08_25_dev@5bff86c0f3a1102c80f3466a8ca0a63db48c0c7d8f142a78a0849219d7844f87
      - curated_panda_domain@1.0
    required_evidence_groups:
      - group_id: n009.e1
        role: elastic_model_alternatives
        critical: true
        any_of:
          - source_id: karavdina_2015
            pdf_page: 50
            pdf_page_end: 53
          - source_id: karavdina_2015
            pdf_page: 54
            pdf_page_end: 59
      - group_id: n009.e2
        role: model_uncertainty_source
        critical: true
        any_of:
          - source_id: karavdina_2015
            pdf_page: 61
            pdf_page_end: 62
      - group_id: n009.e3
        role: e760_code_presence
        critical: true
        any_of:
          - source_id: luminosityfit
            object_type: source_file
            path: model/PndLmdE760ModelParametrization.cxx
          - source_id: luminosityfit
            object_type: source_file
            path: model/PndLmdE760LikeModelParametrization.cxx
    required_source_types:
      - paper
      - code
    required_answer_points:
      - point_id: p1
        text: >-
          Besides DPM, the E760 parametrization was studied as the elastic
          scattering model for PANDA luminosity, and a corresponding model
          exists in LuminosityFit code (PndLmdE760ModelParametrization and an
          E760-like variant).
        weight: 1.0
        critical: true
      - point_id: p2
        text: >-
          The model uncertainty is driven by the beam momentum uncertainty
          mapped onto the momentum transfer, and the thesis quantifies the
          resulting cross-section uncertainty integrated over theta ranges.
        weight: 1.0
        critical: true
      - point_id: p3
        text: >-
          At low beam momenta below about 3.5 GeV/c, where the Coulomb part
          dominates, the expected model uncertainty stays below roughly two
          percent.
        weight: 1.0
        critical: true
