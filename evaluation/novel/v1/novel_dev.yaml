    language: en
    intent: algorithm_implementation
    query: >-
      Full GEANT transport is too slow for my feasibility study of an analysis
      selection. How does PandaRoot's fast simulation produce detector
      responses instead, and which building blocks is it made of?
    expected_status: answered
    allowed_source_versions:
      - luminosityfit@ddd83dcd1a74093bf48ef259a2849a67f9413f32
      - pandaroot@18c09e91100db27867ded30e708b4dae95bd8357
      - restgas_determination@11f1edc49dcbaeb61d707491a6d3bbec390fcd42
      - li_2026@9930dfd79c74b9d1dadc6d1eb6c093ac10ccb45e12f641887bcdc8b823b8690a
      - karavdina_2015@422421852c5a046c24e894a77b9380988ec8172914e9b30b055a100145c07a2b
      - pflueger_2017@1b6ec987fc1430be085f2a7ba631d634f6580115ff0a90dff090dfcba5e990f3
      - pandaroot_sphinx_2023_08_25_dev@5bff86c0f3a1102c80f3466a8ca0a63db48c0c7d8f142a78a0849219d7844f87
      - curated_panda_domain@1.0
    required_evidence_groups:
      - group_id: n010.e1
        role: fastsim_task_api
        critical: true
        any_of:
          - source_id: pandaroot
            object_type: source_file
            path: fastsim/PndFastSim.h
      - group_id: n010.e2
        role: detector_response_abstraction
        critical: true
        any_of:
          - source_id: pandaroot
            object_type: source_file
            path: fastsim/PndFsmAbsDet.h
          - source_id: pandaroot
            object_type: source_file
            path: fastsim/PndFsmResponse.h
    required_source_types:
      - code
    required_answer_points:
      - point_id: p1
        text: >-
          PndFastSim is a FairTask (a PndPersistencyTask) that applies
          parametrized detector responses to generated particles instead of
          running full GEANT transport.
        weight: 1.0
        critical: true
      - point_id: p2
        text: >-
          Detectors are attached with AddDetector either by name with
          parameters or as PndFsmAbsDet implementations, covering subsystems
          such as MVD, EMC, DIRC, STT, TOF, RICH, and MDT.
        weight: 1.0
        critical: true
      - point_id: p3
        text: >-
          Per-detector PndFsmResponse objects are summed and applied to
          PndFsmTrack candidates by cut-and-smear, with options such as
          split-offs, neutral-cluster merging, and electron bremsstrahlung.
        weight: 1.0
        critical: true
    required_identifiers: []
