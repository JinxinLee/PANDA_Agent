    required_source_types:
      - paper
      - code
    required_answer_points:
      - point_id: p1
        text: >-
          Besides DPM, the E760 parametrization was studied as the elastic
          scattering model for PANDA luminosity, and a corresponding model
          exists in LuminosityFit code (PndLmdE760ModelParametrization and an
          E760-like variant).
        weight: 1.0
        critical: true
      - point_id: p2
        text: >-
          For the E760-like model's intrinsic parameter uncertainty, the
          thesis identifies sigma_T and rho as the dominant contributions at
          small |t| and b as dominant at large |t|; over the original 2-8
          GeV/c range it reports the integrated model uncertainty below 0.5%.
        weight: 1.0
        critical: true
      - point_id: p3
        text: >-
          Beam-momentum uncertainty is a separate systematic. The expected
          HESR momentum precision near 5 GeV/c corresponds to Delta P/P around
          10^-5, for which the thesis reports an added E760-like model
          uncertainty below 0.005%; only much larger momentum deviations
          become significant or dominant.
        weight: 1.0
        critical: true
