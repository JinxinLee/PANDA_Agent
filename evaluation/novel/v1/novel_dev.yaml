      - karavdina_2015@422421852c5a046c24e894a77b9380988ec8172914e9b30b055a100145c07a2b
      - pflueger_2017@1b6ec987fc1430be085f2a7ba631d634f6580115ff0a90dff090dfcba5e990f3
      - pandaroot_sphinx_2023_08_25_dev@5bff86c0f3a1102c80f3466a8ca0a63db48c0c7d8f142a78a0849219d7844f87
      - curated_panda_domain@1.0
    required_evidence_groups:
      - group_id: n003.e1
        role: fixed_step_generator_definition
        critical: true
        any_of:
          - source_id: pandaroot
            object_type: source_file
            path: pgenerators/particleguns/PndFixStepParticleGun.h
          - source_id: pandaroot_sphinx_2023_08_25_dev
            object_type: sphinx_page
            path: pandaroot_sphinx_2023_08_25_dev/raw/~pandacc/documentation/2023-08-25-dev/sphinx/EventGenerators/FixStepParticleGun.html
      - group_id: n003.e2
        role: per_event_step_advancement
        critical: true
        any_of:
          - source_id: pandaroot
            object_type: source_file
            path: pgenerators/particleguns/PndFixStepParticleGun.cxx
    required_source_types: []
    required_answer_points:
      - point_id: p1
        text: >-
          The fixed-step scanning generator is PndFixStepParticleGun, a
          PndTargetGenerator subclass.
        weight: 1.0
        critical: true
      - point_id: p2
        text: >-
          Stepping is configured through range setters built on start/stop/step
          values: SetPRange(pmin, pmax, pstep) for momentum and
          SetThetaRange(thetamin, thetamax, thetastep) for the polar angle.
        weight: 1.0
        critical: true
      - point_id: p3
        text: >-
          ReadEvent calls CalcActValues for each generated event. After the
          first event, CalcActValues increments the inner active range by its
          configured step and rolls over into the middle and outer ranges when
          a stop value is exceeded.
        weight: 1.0
        critical: true
    required_identifiers:
