            object_type: source_file
            path: tracking/GenfitTools/recotasks/PndRecoKalmanTask.cxx
    required_source_types:
      - code
    required_answer_points:
      - point_id: p1
        text: >-
          During Init, the task configures either PndRecoKalmanFit or
          PndRecoDafFit according to SetDaf, applies the selected Geane or
          Runge-Kutta track representation and propagation settings, resolves
          the input branch, and registers the configured PndTrack output branch.
        weight: 1.0
        critical: true
      - point_id: p2
        text: >-
          Exec clears the output and skips events above the busy-track cut. For
          each input track it uses either the configured particle hypothesis
          multiplied by track charge or, in ideal-hypothesis mode, the leading
          correlated MCTrack PDG code with the implementation's pion fallbacks.
        weight: 1.0
        critical: true
      - point_id: p3
        text: >-
          For a nonzero selected PDG hypothesis, the configured Kalman or DAF
          fitter produces the fitted track. The task then constructs the output
          PndTrack from the first and last parameters, track candidate, quality
          flag, chi2, NDF, and PID hypothesis, and passes the input index and
          input-branch ID to that constructor.
        weight: 1.0
        critical: true
