      - curated_panda_domain@1.0
    required_evidence_groups:
      - group_id: n031.e1
        role: generator_taxonomy_documentation
        critical: true
        any_of:
          - source_id: pandaroot_sphinx_2023_08_25_dev
            object_type: sphinx_page
            path: pandaroot_sphinx_2023_08_25_dev/raw/~pandacc/documentation/2023-08-25-dev/sphinx/EventGenerators/EventGenerators.html
