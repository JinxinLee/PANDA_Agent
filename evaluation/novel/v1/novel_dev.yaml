      - karavdina_2015@422421852c5a046c24e894a77b9380988ec8172914e9b30b055a100145c07a2b
      - pflueger_2017@1b6ec987fc1430be085f2a7ba631d634f6580115ff0a90dff090dfcba5e990f3
      - pandaroot_sphinx_2023_08_25_dev@5bff86c0f3a1102c80f3466a8ca0a63db48c0c7d8f142a78a0849219d7844f87
      - curated_panda_domain@1.0
    required_evidence_groups:
      - group_id: n015.e1
        role: installation_troubleshooting_page
        critical: true
        any_of:
          - source_id: pandaroot_sphinx_2023_08_25_dev
            object_type: sphinx_page
            path: pandaroot_sphinx_2023_08_25_dev/raw/~pandacc/documentation/2023-08-25-dev/sphinx/Installation/Troubleshooting.html
    required_source_types:
      - documentation
    required_answer_points:
      - point_id: p1
        text: >-
          The documentation suggests configuring with cmake -DNOVC=1 to
          disable the legacy VC package, noting that the failure occurs for
          example on Apple computers and ARM machines, while MacOS is handled
          automatically.
        weight: 1.0
        critical: true
      - point_id: p2
        text: >-
          The side effect is that CAtracking and FtsCATracking are disabled as
          well, because they depend on this legacy version of VC.
        weight: 1.0
        critical: true
