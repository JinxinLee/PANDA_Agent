    required_evidence_groups:
      - group_id: n004.e1
        role: fair_logger_documentation
        critical: true
        any_of:
          - source_id: pandaroot_sphinx_2023_08_25_dev
            object_type: sphinx_page
            path: pandaroot_sphinx_2023_08_25_dev/raw/~pandacc/documentation/2023-08-25-dev/sphinx/Running/Logging.html
          - source_id: pandaroot_sphinx_2023_08_25_dev
            title_contains: Using the Logger from Fair
    required_source_types:
      - documentation
    required_answer_points:
      - point_id: p1
        text: >-
          fair::Logger::SetVerbosity selects a verbosity level (verylow, low,
          medium, high, veryhigh, or user1-user4); a custom spec built with
          fair::VerbositySpec::Make(severity, file_line_function) yields
          [severity][file:line:function] messages, which the documentation
          recommends for debugging macros.
        weight: 1.0
        critical: true
      - point_id: p2
        text: >-
          Additional controls include fair::Logger::SetConsoleColor(true) for
          colored output, which should be disabled when logging to a file
