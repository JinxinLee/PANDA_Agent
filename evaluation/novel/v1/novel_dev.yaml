    required_source_types:
      - code
      - documentation
    required_answer_points:
      - point_id: p1
        text: >-
          The documentation divides generators into background generators,
          which simulate the highest-cross-section physics processes
          (FTFGenerator as the current standard, DPMGenerator as the previous
          one still usable), event generators for one specific physics
          channel (EvtGen), and box generators ("particle guns"), which do
          not simulate an interaction but produce particles of a given type
          with defined distributions (BoxGenerator randomly within
          boundaries, FixStepParticleGun in a fixed pattern).
        weight: 1.0
        critical: true
      - point_id: p2
        text: >-
          In the simulation macros the generator is chosen through the
          inputGenerator string, for example an EvtGen .dec file, "dpm",
          "ftf", or the box syntax box:type(pdg,mult):p(min,max):tht(min,max):phi(min,max).
        weight: 1.0
        critical: true
