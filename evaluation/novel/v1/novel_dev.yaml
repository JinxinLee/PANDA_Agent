  - id: n025
    split: novel_dev
    language: en
    intent: algorithm_implementation
    query: >-
      The displaced-track finder in the restgas branch builds candidates from
      triplets of STT drift circles by solving the classical Apollonius
      tangency problem. How does it keep the triplet combinatorics manageable
      while staying efficient for displaced vertices?
    expected_status: answered
    allowed_source_versions:
      - luminosityfit@ddd83dcd1a74093bf48ef259a2849a67f9413f32
      - pandaroot@18c09e91100db27867ded30e708b4dae95bd8357
      - restgas_determination@11f1edc49dcbaeb61d707491a6d3bbec390fcd42
      - li_2026@9930dfd79c74b9d1dadc6d1eb6c093ac10ccb45e12f641887bcdc8b823b8690a
      - karavdina_2015@422421852c5a046c24e894a77b9380988ec8172914e9b30b055a100145c07a2b
      - pflueger_2017@1b6ec987fc1430be085f2a7ba631d634f6580115ff0a90dff090dfcba5e990f3
      - pandaroot_sphinx_2023_08_25_dev@5bff86c0f3a1102c80f3466a8ca0a63db48c0c7d8f142a78a0849219d7844f87
      - curated_panda_domain@1.0
    required_evidence_groups:
      - group_id: n025.e1
        role: apollonius_approach_documentation
        critical: true
        any_of:
          - source_id: restgas_determination
            path: README.md
      - group_id: n025.e2
        role: triplet_geometry_implementation
        critical: true
        any_of:
          - source_id: restgas_determination
            object_type: source_file
            path: tracking/PndApolloniusTripletTrackFinder/PndApolloniusTriplet.h
    required_source_types:
      - code
    required_answer_points:
      - point_id: p1
        text: >-
          Three STT drift measurements define three circles in the transverse
          plane, and the classical Apollonius problem admits up to eight
          tangent-circle solutions from the internal and external tangency
          combinations.
        weight: 1.0
        critical: true
      - point_id: p2
        text: >-
          The finder reduces the combinatorics by choosing spatially separated
          inner, middle, and outer hit rows and by requiring
          neighbor/topological compatibility and azimuthal compatibility.
        weight: 1.0
        critical: true
      - point_id: p3
        text: >-
          Each candidate is grown with additional compatible hits and the
          populated trajectory that best matches the complete hit pattern is
          selected, which avoids a hard nominal-IP constraint and preserves
          efficiency for displaced vertices.
        weight: 1.0
        critical: true
