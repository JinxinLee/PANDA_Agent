        text: >-
          The standard laboratory frame assumes the interaction point sits
          at the origin, whereas the actual mean interaction point is
          measured as the arithmetic mean of the POCA coordinates,
          (x0, y0, 0).
        weight: 1.0
        critical: true
      - point_id: p2
        text: >-
          Before the luminosity fit, a global coordinate transformation is
          applied to all track data, virtually shifting the detector system
          so that the measured interaction point coincides with the origin.
        weight: 1.0
        critical: true
      - point_id: p3
        text: >-
          This restores the azimuthal symmetry that the 2D luminosity fit
          model requires.
