      benchmark_overlap:
        wording: low
        entity: partial
        evidence: partial
        information_need: low
      rationale: >-
        g047 asks the theoretical purpose of the DPM model. This candidate
        asks a different need: which alternative elastic model was studied
        (E760), that the alternative also exists as LuminosityFit code, and
        what dominates the model uncertainty (beam momentum uncertainty; the
        below-two-percent low-momentum bound). Composition of thesis sections
        plus code and a comparison topology are new; DPM is only the shared
        background entity.
    representativeness:
      class: exploratory
      primary_archetype: theory_explanation
      secondary_archetypes:
        - concept_comparison
      gold_analogue_cases:
        - g047
      distribution_fit: moderate
      corpus_tail: exploratory_tail
      disposition: KEEP_EXPLORATORY
      rationale: >-
        The elastic-model topic is core, but the composed paper-plus-code evidence
        obligation exceeds the representative Gold theory pattern of single-group
        paper evidence; retained as a deliberate composition stress case.
    coverage:
      repositories:
        - luminosityfit
      source_types:
        - paper
        - code
      expression_form: descriptive
      evidence_topology: comparison
      source_scope: cross_source
      repository_scope: single_repository
