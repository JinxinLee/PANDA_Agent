      closest_exposed_cases:
        - g007
      benchmark_overlap:
        wording: low
        entity: none
        evidence: none
        information_need: low
      rationale: >-
        g007 establishes that an exact hardware requirement (GPU memory) is
        not stated by the corpus. This candidate applies the same legitimate
        refusal class to host-platform support: whether the documented Docker
        containers can run natively on Windows. Deterministic search over the
        locked corpus shows no Windows-host statement (the only "windows"
        matches are mass windows in a tutorial), so the expected behavior is a
        grounded insufficient-evidence refusal, not a guessed answer.
