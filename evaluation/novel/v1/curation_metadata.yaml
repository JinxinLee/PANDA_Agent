records:
  - question_id: n001
    curation_family_id: nf001
    intent: installation
    expected_status: answered
    novelty:
      types:
        - entity
      closest_exposed_cases:
        - g002
        - g003
      benchmark_overlap:
        wording: low
        entity: none
        evidence: none
        information_need: low
      rationale: >-
        The exposed installation questions (g001-g012) all target the upstream
        PandaRoot documentation pages. This candidate instead asks about the
        oct19 restgas fork's own GSI setup path: the concrete FairSoft/FairRoot
        version pairs its configSettings.sh recognizes and the SIMPATH /
        FAIRROOTPATH environment it expects. The information need (fork-level
        environment pinning) does not appear in any exposed case.
    representativeness:
      class: representative
      primary_archetype: setup_environment
      secondary_archetypes: []
      gold_analogue_cases:
        - g001
        - g002
      distribution_fit: moderate
      corpus_tail: representative_but_rare
      disposition: KEEP_REPRESENTATIVE
      rationale: >-
        Reuses the common Gold setup archetype on the restgas fork; fork-level
        version pinning is a rarer instance than the upstream setup questions
        g001-g006.
    coverage:
      repositories:
        - restgas_determination
      source_types:
        - code
      expression_form: descriptive
      evidence_topology: single_hop
      source_scope: single_source
      repository_scope: single_repository
      reasoning_forms:
        - procedure
      difficulty: simple
    curation:
      origin: human_directed_llm_draft
      agent_outcome_seen_before_freeze: false
      evidence_selected_from_agent_output: false
      lifecycle: evidence_review_ready
