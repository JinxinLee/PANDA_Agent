schema_version: novel-curation-sidecar-v3
dataset_version: novel-v1-n1-pilot-draft
benchmark_version: novel-v1-dev-0.1.0
records:
  - question_id: n001
    curation_family_id: nf001
    intent: installation
    expected_status: answered
    novelty:
      types:
        - entity
      closest_exposed_cases:
        - g002
        - g003
      benchmark_overlap:
        wording: low
        entity: none
        evidence: none
        information_need: low
      rationale: >-
        The exposed installation questions (g001-g012) all target the upstream
        PandaRoot documentation pages. This candidate instead asks about the
        restgas fork's own GSI setup path: the intended FairSoft/FairRoot
        branch literals, SIMPATH / FAIRROOTPATH assignments, and the script's
        actual malformed-test and echo-only fallback behavior. The information
        need (auditing this fork-level setup script) does not appear in any
        exposed case.
    representativeness:
      class: representative
      primary_task_archetype: setup_environment
      secondary_task_archetypes: []
      gold_analogue_cases:
        - g001
        - g002
      benchmark_reference_fit: moderate
      domain_relevance: strong
      corpus_tail: representative_but_rare
      disposition: KEEP_REPRESENTATIVE
      rationale: >-
        Benchmark analogue: the Gold setup task (g001/g002 asks how to install and
        what prerequisites exist). Domain relevance: running the restgas fork at GSI
        requires understanding this environment pinning, including the script's
        non-enforcing behavior. The version-pair detail is the rarer part of a
        plausible setup task.
    coverage:
      repositories:
        - restgas_determination
      source_types:
        - code
      expression_form: descriptive
      evidence_topology: single_hop
      source_scope: single_source
      repository_scope: single_repository
      reasoning_forms:
        - procedure
      difficulty: simple
    curation:
      origin: human_directed_llm_draft
      agent_outcome_seen_before_freeze: false
      evidence_selected_from_agent_output: false
      lifecycle: evidence_review_ready
