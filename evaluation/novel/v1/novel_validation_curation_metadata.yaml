        entity: high
        evidence: high
        information_need: low
      rationale: >-
        g028 locates PndPidCorrelator, while this candidate traces its
        track-to-PID-candidate contract and detector-set selection. g087 is a
        producer-consumer analogue for a different LMD data product. nf017
