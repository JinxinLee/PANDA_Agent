    intent: algorithm_theory
    expected_status: answered
    novelty:
      types: [relation, task_form]
      closest_exposed_cases: [g051, g053]
      closest_frozen_novel_dev_families: [nf008, nf031]
      closest_frozen_validation_families: [vf002, vf004]
      benchmark_overlap:
        wording: low
        entity: none
        evidence: none
        information_need: low
      rationale: >-
        Gold concept-comparison and detector-property cases establish the task
        form but do not compare PANDA's two DIRC geometries, angular regions,
        and momentum reach. nf008 compares LMD track-search algorithms and
        nf031 compares generator categories; neither shares this detector-PID
        information need. vf002 uses a DRC classifier name in an analysis API,
        while vf004 explains EMC clustering, so neither asks how the two DIRC
        detector systems complement one another.
      family_isolation_rationale: >-
        The minimum answer is the Barrel-versus-Endcap DIRC detector-system
        comparison. It is not a renamed algorithm comparison, PID-list
        operation, or detector-reconstruction workflow from a frozen novel
        family.
    representativeness:
      class: representative
      primary_task_archetype: concept_comparison
      secondary_task_archetypes: [theory_explanation]
      gold_analogue_cases: [g051, g053]
      benchmark_reference_fit: moderate
      domain_relevance: strong
      corpus_tail: representative_core
      disposition: KEEP_REPRESENTATIVE
      rationale: >-
        Detector-system comparisons recur in Gold, and understanding PANDA's
        charged-hadron PID coverage is a routine detector and analysis need.
        The paper source does not by itself make the candidate exploratory.
    coverage:
      repositories: []
      source_types: [paper]
      expression_form: descriptive
      evidence_topology: comparison
      source_scope: single_source
      repository_scope: paper_only
      reasoning_forms: [compare, explain]
      difficulty: moderate
    curation:
      origin: source_anchor_first_llm_draft
      agent_outcome_seen_before_freeze: false
      evidence_selected_from_agent_output: false
