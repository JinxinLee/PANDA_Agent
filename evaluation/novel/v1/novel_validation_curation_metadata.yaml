      family_isolation_rationale: >-
        nf018 performs candidate and whole-tree truth matching, nf019 explains one Kalman/DAF fitting task, and nf026 navigates the RHO tutorial sequence. None defines a channel-wide staged loss diagnosis over linked MC and reconstruction objects.
