records:
  - question_id: n901
    curation_family_id: vf001
    intent: installation
    expected_status: answered
    novelty:
      types: [relation, task_form]
      closest_exposed_cases: [g001, g002]
      closest_frozen_novel_dev_families: [nf001, nf015]
      benchmark_overlap:
        wording: low
        entity: partial
        evidence: none
        information_need: low
      rationale: >-
        Exposed setup cases concern installing or entering PandaRoot itself. This candidate starts from the independently sampled external-package documentation and asks how a separately maintained package links to an installed PandaRoot and inherits FairRoot/VMC setup.
      family_isolation_rationale: >-
        nf001 audits RestgasDetermination's own version-pair shell script, while nf015 diagnoses an ARM VC build failure. Neither asks for the external-package CMake integration boundary or its default installation location.
    representativeness:
      class: representative
      primary_task_archetype: setup_environment
      secondary_task_archetypes: []
      gold_analogue_cases: [g001, g002]
      benchmark_reference_fit: strong
      domain_relevance: strong
      corpus_tail: representative_core
      disposition: KEEP_REPRESENTATIVE
      rationale: >-
        Setup work recurs in the Gold reference, and maintaining analysis packages against PandaRoot is a routine software-development need. The concrete integration contract is independent of the frozen setup families.
    coverage:
      repositories: [pandaroot]
      source_types: [documentation]
      expression_form: descriptive
      evidence_topology: multi_hop
      source_scope: single_source
      repository_scope: single_repository
      reasoning_forms: [procedure, explain]
      difficulty: moderate
    curation:
      origin: source_anchor_first_llm_draft
      agent_outcome_seen_before_freeze: false
      evidence_selected_from_agent_output: false
      lifecycle: split_frozen

