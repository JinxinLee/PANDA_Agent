        correlation. vf002 consumes already produced PID probabilities in RHO,
        and vf005 merges homogeneous PndTrack arrays rather than enriching
        tracks into PndPidCandidate records.
      family_isolation_rationale: >-
        The minimum information need is the generic reconstruction-to-PID
        handoff, including region-dependent detector correlation and the
        persisted candidate link. No frozen novel family measures that
        boundary.
    representativeness:
      class: representative
