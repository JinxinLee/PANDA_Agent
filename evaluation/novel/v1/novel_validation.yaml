questions:
  - id: n901
    split: novel_validation
    language: en
    intent: installation
    query: >-
      I maintain an external analysis package that must compile against an installed PandaRoot. Which setup script must I source, which CMake module and setup macro connect the package to PandaRoot, FairRoot, and VMC, and where does the example install by default?
    expected_status: answered
    allowed_source_versions:
      - pandaroot_sphinx_2023_08_25_dev@5bff86c0f3a1102c80f3466a8ca0a63db48c0c7d8f142a78a0849219d7844f87
    required_evidence_groups:
      - group_id: n901.e1
        role: installed_pandaroot_environment_export
        critical: true
        any_of:
          - source_id: pandaroot_sphinx_2023_08_25_dev
            object_type: sphinx_page
            path: pandaroot_sphinx_2023_08_25_dev/raw/~pandacc/documentation/2023-08-25-dev/sphinx/Installation/Building_ExternalPackage.html
      - group_id: n901.e2
        role: external_package_cmake_and_install_contract
        critical: true
        any_of:
          - source_id: pandaroot_sphinx_2023_08_25_dev
            object_type: sphinx_page
            path: pandaroot_sphinx_2023_08_25_dev/raw/~pandacc/documentation/2023-08-25-dev/sphinx/Installation/Building_ExternalPackage.html
    required_source_types:
      - documentation
    required_answer_points:
      - point_id: p1
        text: >-
          Source the installed bin/PandaRootConfig.sh with the -a option. The script exports PANDAROOTPATH and PandaRoot include paths needed to compile and link against the installed tree.
        weight: 1.0
        critical: true
      - point_id: p2
        text: >-
          The external package must currently carry FindPandaROOT.cmake. Its CMake flow uses find_package(PandaRoot REQUIRED), extends CMAKE_MODULE_PATH with PANDAROOT_CMAKEMOD_DIR, includes PandaRootSetup, and calls pandaroot_setup(), which locates FairRoot and VMC for the package.
        weight: 1.0
        critical: true
      - point_id: p3
        text: >-
          Unless CMAKE_INSTALL_PREFIX is overridden, the example takes PANDA_3RDPARTY_INSTALL_DIR as its install prefix, described as the PandaRoot installation's 3rdParty area; sourcing PandaRootConfig.sh -a again exposes the added package include paths.
        weight: 1.0
        critical: true
    required_identifiers:
      - text: PandaRootConfig.sh
        kind: path
        critical: true
      - text: FindPandaROOT.cmake
        kind: path
        critical: true
      - text: pandaroot_setup
        kind: code_symbol
        critical: true
    forbidden_evidence: []
    concept_scopes: {}
    cluster_id: vf001
    challenge_tags: []
    review_status: approved
    reviewer: Li
    reviewed_at: 2026-08-25T23:18+02:00

  - id: n902
    split: novel_validation
    language: en
    intent: usage
    query: >-
      In a RHO analysis, how do I request positively charged kaon candidates with a PID threshold, choose a particular detector algorithm, and combine several PID algorithms?
    expected_status: answered
    allowed_source_versions:
      - pandaroot_sphinx_2023_08_25_dev@5bff86c0f3a1102c80f3466a8ca0a63db48c0c7d8f142a78a0849219d7844f87
    required_evidence_groups:
      - group_id: n902.e1
        role: fill_list_pid_selection_syntax
        critical: true
        any_of:
          - source_id: pandaroot_sphinx_2023_08_25_dev
            object_type: sphinx_page
            path: pandaroot_sphinx_2023_08_25_dev/raw/~pandacc/documentation/2023-08-25-dev/sphinx/Tutorials/tut_02_02_analysis_pid.html
      - group_id: n902.e2
        role: detector_algorithm_selection_and_combination
        critical: true
        any_of:
          - source_id: pandaroot_sphinx_2023_08_25_dev
            object_type: sphinx_page
            path: pandaroot_sphinx_2023_08_25_dev/raw/~pandacc/documentation/2023-08-25-dev/sphinx/Tutorials/tut_02_02_analysis_pid.html
    required_source_types:
      - documentation
    required_answer_points:
      - point_id: p1
        text: >-
          Use PndAnalysis::FillList with a particle, criterion, and charge keyword. For example, KaonTightPlus selects positive kaon candidates with the documented Tight threshold P >= 0.5, while a suffix such as KaonPlus0.45 applies an explicit probability threshold.
        weight: 1.0
        critical: true
      - point_id: p2
        text: >-
          Pass a PID algorithm name as FillList's third argument, for example PidAlgoDrc. The classifier tasks provide probabilities for the five charged-particle hypotheses from their detector responses.
        weight: 1.0
        critical: true
      - point_id: p3
        text: >-
          A semicolon-separated third argument such as PidAlgoEmcBayes;PidAlgoDrc;PidAlgoStt combines algorithms; the documented combination multiplies their per-species probability values before applying the selection criterion.
        weight: 1.0
        critical: true
    required_identifiers:
      - text: PndAnalysis::FillList
        kind: code_symbol
        critical: true
      - text: PidAlgoDrc
        kind: code_symbol
        critical: true
    forbidden_evidence: []
    concept_scopes: {}
