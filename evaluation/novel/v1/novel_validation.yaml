  - id: n907
    split: novel_validation
    language: en
    intent: algorithm_theory
    query: >-
      PANDA uses both a Barrel DIRC and an Endcap Disc DIRC for charged-hadron
      identification. How do their radiator and photon-readout geometries,
      angular coverage, and pion-kaon momentum reach complement each other?
    expected_status: answered
    allowed_source_versions:
      - li_2026@9930dfd79c74b9d1dadc6d1eb6c093ac10ccb45e12f641887bcdc8b823b8690a
    required_evidence_groups:
      - group_id: n907.e1
        role: barrel_and_endcap_dirc_comparison
        critical: true
        any_of:
          - source_id: li_2026
            pdf_page: 46
            pdf_page_end: 47
    required_source_types:
      - paper
    required_answer_points:
      - point_id: p1
        text: >-
          Both systems use fused silica radiators and MCP-PMT readout, but the
          Barrel DIRC surrounds the STT with 48 narrow bars whose internally
          reflected photons pass through a prism and focusing lenses to the
          sensors.
        weight: 1.0
        critical: true
      - point_id: p2
        text: >-
          The Barrel DIRC covers polar angles from 22 to 140 degrees and is
          designed for pion-kaon separation above three standard deviations
          up to 3.5 GeV/c.
        weight: 1.0
        critical: true
      - point_id: p3
        text: >-
          The Endcap Disc DIRC covers the forward 5-to-22-degree region with
          four radiator-plate quadrants and focusing elements at the outer rim,
          extending pion-kaon separation to about 4 GeV/c in that acceptance.
        weight: 1.0
        critical: true
    required_identifiers: []
    forbidden_evidence: []
    concept_scopes: {}
    cluster_id: vf007
    challenge_tags: []
    review_status: approved
    reviewer: Li
    reviewed_at: 2026-08-26T15:36+02:00

