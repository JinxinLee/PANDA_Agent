  - id: n915
    split: novel_validation
    language: en
    intent: algorithm_theory
    query: >-
      While studying a three-body decay with PandaRoot's DalitzGUI, how can
      interference leave a resonance band visible in the Dalitz plot while
      its peak moves or disappears in a one-dimensional projection, and which
      built-in views expose the coherent-versus-incoherent effect?
    expected_status: answered
    allowed_source_versions:
      - pandaroot_sphinx_2023_08_25_dev@5bff86c0f3a1102c80f3466a8ca0a63db48c0c7d8f142a78a0849219d7844f87
    required_evidence_groups:
      - group_id: n915.e1
        role: dalitz_interference_projection_diagnosis
        critical: true
        any_of:
          - source_id: pandaroot_sphinx_2023_08_25_dev
            object_type: sphinx_page
            path: pandaroot_sphinx_2023_08_25_dev/raw/~pandacc/documentation/2023-08-25-dev/sphinx/Tutorials/DalitzGui.html
    required_source_types:
      - documentation
    required_answer_points:
      - point_id: p1
        text: >-
          DalitzGUI combines active resonance amplitudes with adjustable
          complex coefficients A*exp(i*phi). Changing a relative phase changes
          constructive and destructive interference, so a projected peak can
          move or cancel even though the two-dimensional resonance band
          remains visible.
        weight: 1.0
        critical: true
      - point_id: p2
        text: >-
          A one-dimensional projection can also contain reflections whose
          peaks do not coincide with a resonance pole mass, so a projected
          peak alone is not a reliable resonance identifier.
        weight: 1.0
        critical: true
      - point_id: p3
        text: >-
          Compare Dalitz or Dalitz (scat) with Dalitz In, the incoherent sum,
          and Dalitz Diff, the difference between incoherent and coherent
          sums; Dalitz Ph
          and the s23/s31/s12 projections expose the phase and projection
          behavior directly.
        weight: 1.0
        critical: true
    required_identifiers:
      - text: DalitzGUI
        kind: code_symbol
        critical: true
    forbidden_evidence: []
    concept_scopes: {}
    cluster_id: vf015
    challenge_tags: []
