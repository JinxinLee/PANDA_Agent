  - id: n909
    split: novel_validation
    language: en
    intent: algorithm_implementation
    query: >-
      When PandaRoot uses a multi-part magnetic field, how does PndMultiField
      choose which field map supplies the value at a space point, and how does
      the selected PndFieldMap evaluate that global point on its grid?
    expected_status: answered
    allowed_source_versions:
      - pandaroot@18c09e91100db27867ded30e708b4dae95bd8357
    required_evidence_groups:
      - group_id: n909.e1
        role: multi_field_piece_selection
        critical: true
        any_of:
          - source_id: pandaroot
            object_type: source_file
            path: field/PndMultiField.cxx
      - group_id: n909.e2
        role: field_map_coordinate_lookup_and_interpolation
        critical: true
        any_of:
          - source_id: pandaroot
            object_type: source_file
            path: field/PndFieldMap.cxx
    required_source_types:
      - code
    required_answer_points:
      - point_id: p1
        text: >-
          PndMultiField initializes an ordered list of field pieces with their
          z ranges. GetFieldValue uses the first piece whose z interval covers
          the query point, so map order is precedence rather than an overlap
          sum; if no interval matches, it returns a zero field.
        weight: 1.0
        critical: true
      - point_id: p2
        text: >-
          PndFieldMap transforms a global query into local map coordinates by
          subtracting the configured field-center position and rejects points
          outside the local grid bounds.
        weight: 1.0
        critical: true
      - point_id: p3
        text: >-
          For an interior point, PndFieldMap identifies the surrounding grid
          cell and evaluates each field component by interpolation across the
          cell's eight corner values.
        weight: 1.0
        critical: true
    required_identifiers:
      - text: PndMultiField
        kind: code_symbol
        critical: true
      - text: PndFieldMap
        kind: code_symbol
        critical: true
    forbidden_evidence: []
    concept_scopes: {}
    cluster_id: vf009
    challenge_tags: []
    review_status: approved
    reviewer: Li
    reviewed_at: 2026-08-26T15:36+02:00

