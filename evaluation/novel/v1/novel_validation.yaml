  - id: n903
    split: novel_validation
    language: en
    intent: troubleshooting
    query: >-
      I need to find the reconstruction stage at which a simulated decay channel loses events. What two-stage MCTrackAnalysis workflow does PandaRoot document, what information is attached first, and how are decay and reconstruction requirements expressed for the diagnosis?
    expected_status: answered
    allowed_source_versions:
      - pandaroot_sphinx_2023_08_25_dev@5bff86c0f3a1102c80f3466a8ca0a63db48c0c7d8f142a78a0849219d7844f87
    required_evidence_groups:
      - group_id: n903.e1
        role: mctrackinfo_enrichment_stage
        critical: true
        any_of:
          - source_id: pandaroot_sphinx_2023_08_25_dev
            object_type: sphinx_page
            path: pandaroot_sphinx_2023_08_25_dev/raw/~pandacc/documentation/2023-08-25-dev/sphinx/Tools/MCTrackAna/MCTrackAna.html
      - group_id: n903.e2
        role: requirements_and_failure_diagnosis_stage
        critical: true
        any_of:
          - source_id: pandaroot_sphinx_2023_08_25_dev
            object_type: sphinx_page
            path: pandaroot_sphinx_2023_08_25_dev/raw/~pandacc/documentation/2023-08-25-dev/sphinx/Tools/MCTrackAna/MCTrackAna.html
    required_source_types:
      - documentation
    required_answer_points:
      - point_id: p1
        text: >-
          The first stage runs PndMCTrackInfoTask to extend each MCTrack with PndMCTrackInfo. The documented additions include decay and mother/daughter history, FairLinks through reconstruction objects, reconstructed momenta for tracking algorithms, and PID probabilities.
        weight: 1.0
        critical: true
      - point_id: p2
        text: >-
          The second stage analyzes those PndMCTrackInfo objects. A PndEventRequirements object contains PndParticleRequirements records: SetPID and SetPIDMothers define the required particle and mother chain, while daughter, tracking, PID, and neutral checks are optional refinements.
        weight: 1.0
        critical: true
      - point_id: p3
        text: >-
          The documented output reports per-requirement survival, the requirement position where reconstruction failed, and the event numbers for those failures, allowing a decay channel to be traced to the losing reconstruction stage.
        weight: 1.0
        critical: true
    required_identifiers:
      - text: PndMCTrackInfoTask
        kind: code_symbol
        critical: true
      - text: PndEventRequirements
        kind: code_symbol
        critical: true
      - text: PndParticleRequirements
        kind: code_symbol
        critical: true
    forbidden_evidence: []
    concept_scopes: {}
    cluster_id: vf003
    challenge_tags: []
    review_status: approved
    reviewer: Li
    reviewed_at: 2026-08-25T23:18+02:00

  - id: n904
    split: novel_validation
    language: en
    intent: algorithm_implementation
    query: >-
      In PandaRoot EMC reconstruction, how are calorimeter digis turned into clusters, and why is a later bump-splitting stage needed?
    expected_status: answered
    allowed_source_versions:
      - pandaroot@18c09e91100db27867ded30e708b4dae95bd8357
    required_evidence_groups:
      - group_id: n904.e1
        role: digi_to_cluster_implementation
        critical: true
        any_of:
          - source_id: pandaroot
            object_type: source_file
            path: detectors/emc/EmcReco/PndEmcMakeCluster.cxx
      - group_id: n904.e2
        role: local_maximum_cluster_to_bump_split
        critical: true
        any_of:
          - source_id: pandaroot
            object_type: source_file
            path: detectors/emc/EmcReco/PndEmcExpClusterSplitter.cxx
    required_source_types:
      - code
    required_answer_points:
      - point_id: p1
        text: >-
          PndEmcMakeCluster reads EmcDigi data, rejects digis below the section-specific reconstruction thresholds, establishes valid spatial-neighbour relations, and merges connected preclusters into EmcCluster objects.
        weight: 1.0
        critical: true
      - point_id: p2
        text: >-
          A cluster can contain more than one local energy maximum, so it is not necessarily one shower candidate. PndEmcExpClusterSplitter reads each cluster's LocalMaxMap and creates EmcBump objects associated with the maxima.
        weight: 1.0
        critical: true
      - point_id: p3
        text: >-
          The splitter records the apportioned crystal contribution through EmcSharedDigi objects as it forms the bump output; this is the implementation boundary between connected-digi clustering and local-maximum shower separation.
        weight: 1.0
        critical: true
    required_identifiers:
      - text: PndEmcMakeCluster
        kind: code_symbol
        critical: true
      - text: PndEmcExpClusterSplitter
        kind: code_symbol
        critical: true
    forbidden_evidence: []
    concept_scopes: {}
    cluster_id: vf004
    challenge_tags: []
    review_status: approved
    reviewer: Li
    reviewed_at: 2026-08-26T00:21+02:00

  - id: n905
    split: novel_validation
    language: en
    intent: api
    query: >-
      I have several PandaRoot branches containing PndTrack objects and need a single track branch for downstream tasks. What does PndTrackArrayMerger accept, what does it produce by default, and how does it handle unavailable or wrong-type inputs?
    expected_status: answered
    allowed_source_versions:
      - pandaroot@18c09e91100db27867ded30e708b4dae95bd8357
    required_evidence_groups:
      - group_id: n905.e1
        role: track_array_merger_interface
        critical: true
        any_of:
          - source_id: pandaroot
            object_type: source_file
            path: tools/PndTrackArrayMerger.h
      - group_id: n905.e2
        role: track_array_merger_initialization_and_execution
        critical: true
        any_of:
          - source_id: pandaroot
            object_type: source_file
            path: tools/PndTrackArrayMerger.cxx
    required_source_types:
      - code
    required_answer_points:
      - point_id: p1
        text: >-
          AddInputBranch appends input branch names, SetOutputBranch changes the destination, and SetPersistance controls whether it is stored. The default constructor sets the output branch name to ALLTracks. During Init, the task registers the configured output as a PndTrack branch in the AllTracks folder.
        weight: 1.0
        critical: true
      - point_id: p2
        text: >-
          During Init, a missing named branch is reported and skipped, and only input arrays whose element class is PndTrack are retained. Other array types are not added to the merge list.
        weight: 1.0
        critical: true
      - point_id: p3
        text: >-
          On each Exec, the output is cleared and AbsorbObjects is called for each retained input array to collect its PndTrack entries into the configured output branch.
        weight: 1.0
        critical: true
    required_identifiers:
      - text: PndTrackArrayMerger
        kind: code_symbol
        critical: true
      - text: ALLTracks
        kind: code_symbol
        critical: true
    forbidden_evidence: []
    concept_scopes: {}
    cluster_id: vf005
    challenge_tags: []
    review_status: approved
