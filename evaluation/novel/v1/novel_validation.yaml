  - id: n912
    split: novel_validation
    language: en
    intent: algorithm_theory
    query: >-
      Why does PANDA use an iron-and-MDT range system to distinguish muons
      from pions when Cherenkov and time-of-flight detectors cannot, and what
      observable does that layered design reconstruct?
