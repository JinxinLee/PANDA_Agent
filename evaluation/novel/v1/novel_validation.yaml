            object_type: sphinx_page
            path: pandaroot_sphinx_2023_08_25_dev/raw/~pandacc/documentation/2023-08-25-dev/sphinx/Tutorials/tut_02_03_analysis_combinatorics.html
    required_source_types:
      - documentation
    required_answer_points:
      - point_id: p1
        text: >-
          Use jpsi.Combine(muplus, muminus) for the two-body candidate and then
          psi.Combine(jpsi, piplus, piminus) for the higher decay; use explicit
          RhoCandidate::Combine loops only when checks must be inserted before
          appending a combination.
        weight: 1.0
        critical: true
      - point_id: p2
        text: >-
          Construct a RhoMassParticleSelector with the J/psi mass-window center
          and full width and apply it through jpsi.Select before forming the
          parent candidate.
        weight: 1.0
        critical: true
      - point_id: p3
        text: >-
          RhoCandList::Combine is documented to avoid double counting and
          overlap, including reusing one reconstructed particle more than once
          in a composite candidate under different mass hypotheses.
        weight: 1.0
        critical: true
    required_identifiers:
