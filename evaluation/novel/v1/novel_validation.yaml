  - id: n911
    split: novel_validation
    language: en
    intent: usage
    query: >-
      After filling particle lists in a RHO analysis, how can I build a
      J/psi-to-muon-pair candidate and then a psi(2S)-to-J/psi-pion-pair
      candidate, apply a J/psi mass window, and avoid reused daughters or
      double-counted combinations?
    expected_status: answered
    allowed_source_versions:
      - pandaroot_sphinx_2023_08_25_dev@5bff86c0f3a1102c80f3466a8ca0a63db48c0c7d8f142a78a0849219d7844f87
    required_evidence_groups:
