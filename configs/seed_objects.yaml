    text: Reconstruction efficiency as a function of longitudinal interaction position.
    identity_role: canonical
  - object_id: data_product.reconstructed_restgas_profile
    object_type: data_product
    title: Reconstructed restgas profile
    text: Corrected longitudinal restgas density profile used downstream.
    identity_role: canonical
  - object_id: repository.restgas_determination.oct19
    object_type: repository_version
    title: RestgasDetermination oct19
    text: Curated repository-version entity for the locked oct19-derived implementation.
    identity_role: source_native
  - object_id: repository.pandaroot.oct19
    object_type: repository_version
    title: PandaRoot oct19
    text: Curated upstream repository-version entity for RestgasDetermination provenance.
    identity_role: source_native
  - object_id: document.pandaroot_sphinx_2023_08_25_dev
    object_type: document_reference
    title: PandaRoot Sphinx 2023-08-25-dev
    text: Curated reference to the locked generic PandaRoot operational documentation.
    identity_role: canonical
  - object_id: workflow.pandaroot.generic
    object_type: workflow
    title: Generic PandaRoot workflow
    text: Generic simulation, digitization, reconstruction, PID, and analysis workflow.
    identity_role: canonical
  - object_id: configuration.restgas_profile
    object_type: configuration_key
    title: restgas_profile
    text: Configuration key selecting a concrete longitudinal restgas density profile file; it is not itself a fixed filename.
    identity_role: canonical
  - object_id: file_pattern.restgas_profile_input
    object_type: file_pattern
    title: restgas_16012024_*.txt
    text: Pattern representing the concrete restgas profile input files documented by the locked RestgasDetermination corpus.
    identity_role: canonical
  - object_id: data_product.restgas.event_poca
    object_type: root_tree
    title: event_poca
    text: Event-indexed ROOT tree produced during first-pass POCA analysis and consumed by second-pass PID propagation.
    identity_role: canonical
    parent_object_id: data_product.restgas.boost_root
  - object_id: data_product.restgas.boost_root
    object_type: data_product
    title: "*_boost.root"
    text: First-pass analysis output containing the event_poca tree.
    identity_role: canonical
  - object_id: data_product.restgas.pid_root
    object_type: data_product
    title: "*_pid.root"
    text: First-pass PID data product consumed by the POCA analysis.
    identity_role: canonical
  - object_id: data_product.restgas.pid_final_root
    object_type: data_product
    title: "*_pid_final.root"
    text: Second-pass PID output generated after event-specific POCA propagation.
    identity_role: canonical
  - object_id: workflow.restgas.second_pass_pid
    object_type: workflow
    title: Restgas second-pass PID workflow
    text: Workflow that reads event_poca through POCA_VERTEX_FILE and writes the final PID product.
    identity_role: canonical
  - object_id: workflow.restgas.first_pass_poca
    object_type: workflow
    title: Restgas first-pass POCA analysis
    text: >-
      First-pass analysis process of the RestgasDetermination two-pass
      reconstruction: it consumes the first-pass PID product, performs the
      event-by-event POCA vertex extrapolation of target-spectrometer tracks,
      and writes the boost ROOT output containing the event_poca tree. The
      process is a stable domain abstraction of the analysis stage implemented
      by the locked macro/target/ana_dpm.C source.
    identity_role: canonical
  - object_id: concept.luminosityfit.differential_luminosity_model
    object_type: physics_concept
    title: Differential luminosity model
    text: >-
      The differential luminosity model of the LuminosityFit framework: a model
      of the reconstructed photon-pair kinematics composed from the DPM
      elastic-scattering cross section, the LMD angular acceptance, and the
      detector resolution smearing, assembled by the model factory and fitted
      to data to determine the luminosity. The abstraction is defined by the
      LuminosityFit framework chapter of the Pflueger thesis and realized by
      the model-and-fit subsystem; it is stable across corpus versions.
    identity_role: canonical
