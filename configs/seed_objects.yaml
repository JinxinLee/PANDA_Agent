  - object_id: workflow.restgas_aware_luminosity_acceptance
    object_type: workflow
    title: Restgas-aware luminosity acceptance workflow
    text: Workflow that regenerates LMD acceptance from a measured restgas profile.
    identity_role: canonical
  - object_id: workflow.restgas_profile_reconstruction
    object_type: workflow
    title: Restgas profile reconstruction workflow
    text: Two-pass reconstruction and longitudinal efficiency correction workflow.
    identity_role: canonical
  - object_id: concept.restgas_longitudinal_efficiency
    object_type: physics_concept
