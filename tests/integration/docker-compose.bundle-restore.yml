services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: panda_qa
      POSTGRES_USER: panda
      POSTGRES_PASSWORD: panda
    ports:
      - "127.0.0.1:55433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U panda -d panda_qa"]
      interval: 5s
      timeout: 3s
      retries: 20

  qdrant:
    image: qdrant/qdrant:v1.15.5
    ports:
      - "127.0.0.1:6335:6333"
    healthcheck:
      test: ["CMD", "bash", "-c", "</dev/tcp/localhost/6333"]
      interval: 5s
      timeout: 3s
      retries: 20
